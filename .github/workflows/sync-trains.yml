name: Sync official train catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'
permissions:
  contents: write
concurrency:
  group: train-catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: research/trains/cache
          key: train-pages-${{ github.run_id }}
          restore-keys: train-pages-
      - run: python scripts/sync-trains.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: python scripts/package-source.py
      - name: Save validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/trains.json dist/train-images dist/rail-studio-source.zip dist/*.html dist/*.js dist/*.css dist/web.config
          if ! git diff --cached --quiet; then
            git commit -m "data: sync official train catalogue"
            git push
          fi
